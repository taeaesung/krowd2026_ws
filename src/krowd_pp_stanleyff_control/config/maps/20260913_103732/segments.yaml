# =============================================================================
# 구간별 속도·조향 파라미터 - 지도 20260913_103732 (586 waypoints) 전용
#
# 각 행은 waypoint 범위(start_idx~end_idx, 양 끝 포함)에 대한 *덮어쓰기* 값이다.
#   speed_kmh                  이 구간의 속도 상한 (km/h). null = 전역/미션 상한 그대로
#   lookahead_straight_m       직선 lookahead (기본 pure_pursuit.lookahead_straight_m = 7.0)
#   lookahead_curve_m          곡선 lookahead (기본 3.0)
#   straight_radius_m          직선으로 보는 반경 (기본 50 m), curve_radius_m 곡선 반경 (기본 15 m)
#   max_road_wheel_rate_deg_s  조향 명령 slew limit (기본 steering.max_road_wheel_rate_deg_s = 40)
#
# 규칙
#   - 구간은 서로 겹치면 안 된다. 비어 있는 구간은 전역값을 쓴다.
#   - 여기 값은 안전 로직 위에서 "더 느리게"만 만들 수 있다.
#   - 편집 후: 정지 상태에서  ros2 service call /pp_stanleyff_control_node/reload_config std_srvs/srv/Trigger
# =============================================================================
segments:
  list:
