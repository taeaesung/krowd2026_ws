# Full-route metric map rebuilt from the already deskewed observation saved in
# every SimpleMap keyframe. The structure follows MOLA's official
# sm2mm_pointcloud_voxelize_keyframe_map pipeline, while retaining the full
# route (no keyframe eviction) and using the same 0.25 m RViz map resolution.

generators:
  - class_name: mp2p_icp_filters::Generator
    params:
      name: "accepted deskewed scan"
      target_layer: "raw"
      filterOutPointsAtZero: true
      throw_on_unhandled_observation_class: false
      process_class_names_regex: ".*"
      process_sensor_labels_regex: "^deskewed$"

  - class_name: mp2p_icp_filters::Generator
    params:
      name: "full-route keyframe map"
      target_layer: "localmap"
      throw_on_unhandled_observation_class: false
      process_class_names_regex: ""
      metric_map_definition:
        class: mola::KeyframePointCloudMap
        plugin: "libmola_metric_maps.so"
        creationOpts:
          max_search_keyframes: 3
          k_correspondences_for_cov: 20
          min_correspondences_for_cov: 5
          max_distance_for_cov: 2.0
          use_view_direction_filter: true
          max_view_angle_deg: 120
          rotation_distance_weight: 2.0
          num_diverse_keyframes: 1
          serialize_kdtrees: false
          serialize_covariances: false
        insertOpts:
          remove_frames_farther_than: 0
        likelihoodOpts: ~
        renderOpts:
          color.A: 0.25
          colormap: "cmHOT"
          recolorByPointField: "intensity"
          max_points_per_kf: 10000
          max_overall_points: 500000

filters:
  - class_name: mp2p_icp_filters::FilterDecimateVoxels
    params:
      input_pointcloud_layer: "raw"
      output_pointcloud_layer: "decimated"
      voxel_filter_resolution: 0.25
      decimate_method: DecimateMethod::FirstPoint

  - class_name: mp2p_icp_filters::FilterByRange
    params:
      input_pointcloud_layer: "decimated"
      output_layer_between: "filtered"
      range_min: 2.0
      range_max: 75.0
      center: [robot_x, robot_y, robot_z]

  - class_name: mp2p_icp_filters::FilterMerge
    params:
      input_pointcloud_layer: "filtered"
      target_layer: "localmap"
      robot_pose: [robot_x, robot_y, robot_z, robot_yaw, robot_pitch, robot_roll]
      input_layer_in_local_coordinates: false

  - class_name: mp2p_icp_filters::FilterDeleteLayer
    params:
      pointcloud_layer_to_remove: ["raw", "decimated", "filtered"]
