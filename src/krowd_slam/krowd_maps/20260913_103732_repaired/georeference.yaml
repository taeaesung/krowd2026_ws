note: 'Point coordinates stay near the run origin for numeric precision. Use pointcloud_map_to_global
  to place global_map.mm in UTM. The route is rebuilt in one operation from the complete
  source-pose history using the latest single global transform, so early global yaw
  corrections cannot kink it. A rigid transform cannot remove drift internal to the
  source trajectory, which is why the source is the RTK/IMU pose rather than LiDAR
  odometry: the point-cloud map still carries LiDAR drift, so expect the route and
  LiDAR-only localization to disagree by that drift. pointcloud_map_to_global/enu
  come from a rigid least-squares fit of the whole LiDAR-odometry history onto the
  fused route (pointcloud_map_placement holds its residuals); a large residual there
  means the odometry itself is deformed and the map should not be trusted for localization.'
