# =============================================================================
# 자주 만지는 값 — 증상별로 여기부터
# =============================================================================
#
#   직선 속도 (현재 5.56 km/h)     route_publisher_node.max_speed_kmph
#   곡선 속도 (현재 2.78 km/h)     route_publisher_node.curve_max_speed_kmph / min_speed_kmph
#   곡선 안에서 급한 코너 속도      route_publisher_node.max_lateral_accel_mps2 / min_speed_kmph
#   조향이 반대로 간다              pure_pursuit_node.steering_sign
#   조향이 흔들린다 / 과민하다      pure_pursuit_node.lookahead_min_m   (키운다)
#   코너를 안쪽으로 자른다          pure_pursuit_node.lookahead_min_m   (줄인다)
#   출발/정지가 급하다              route_publisher_node.max_accel_mps2 / max_decel_mps2
#   yaw가 안 잡혀 출발을 못 한다      ESKF -> LiDAR -> 직진 크립 순. 크립은 <controller>.heading_creep_* (NEEDS_MOTION일 때만)
#   끝에서 멈추고 잠그기 (도착 처리)  route_publisher_node.goal_mode: STOP_AT_END
#   루프를 계속 돌게               route_publisher_node.loop_closure_max_gap_m: 10.0 (주석 참고)
#
#   [Stanley] controller_type:=stanley 일 때
#   방향이 틀린 채 출발해서 위험하다   stanley_node.max_heading_error_deg 를 60 으로 (출발 게이트 복구)
#   경로 좌우로 흔들린다            stanley_node.cross_track_gain       (줄인다)
#   경로에 늦게 붙는다 / 바깥으로 돈다  stanley_node.cross_track_gain       (키운다)
#   저속에서 조향이 과민하다        stanley_node.cross_track_softening_kmph (키운다)
#   직선에서 핸들이 떨린다          stanley_node.heading_gain (줄인다) / heading_window_m (키운다)
#
# Pure Pursuit에는 별도의 "조향 게인"이 없습니다. 조향의 세기를 정하는 것은
# lookahead 거리 하나뿐입니다 — 멀리 볼수록 부드럽고 둔하게, 가까이 볼수록
# 민첩하고 예민하게 움직입니다. 그래서 조향 튜닝 = lookahead 튜닝입니다.
#
# 차량 자체의 값(축거, 조향 한계, 조향 각속도 한계)은 여기가 아니라
# config/vehicle.yaml에 있습니다.
#
# 단위: 속도는 전부 km/h(`_kmph`)입니다. 노드가 파라미터를 읽는 그 지점에서
# 한 번만 m/s로 바꾸고, 그 아래의 속도 프로파일과 Trajectory 메시지는 전부
# SI(m/s)입니다. 가속도는 m/s^2 그대로입니다 — km/h/s는 쓰는 데가 없습니다.
#
# 2026-09-19 /target_speed 단위: 구동 MCU 는 km/h 를 받는데(브리지는 x100 만
# 함) 이 패키지는 m/s 를 그대로 보내고 있었다. 이제 컨트롤러가 토픽으로 낼 때
# 한 번 x3.6 한다(vehicle.speed_command_kmh). 이 파일의 값은 예전 그대로다:
# *_kmph 는 km/h, *_mps2 는 m/s^2 (물리 단위). 여기서 3.6 이나 12.96 으로
# 미리 나누면 이중 변환이 되어 직선 5 km/h, 가속 0.2 m/s^2 가 된다 (같은 날
# 한 번 그렇게 됐었다).
# =============================================================================

route_publisher_node:
  ros__parameters:
    utm_frame: "utm"
    # 웨이포인트는 UTM으로 저장되지만 발행 전에 로컬라이제이션 프레임으로
    # 변환됩니다. UTM northing은 약 4e6 m라 단정밀도 사용 측에서 눈에 띄는
    # 정밀도 손실이 발생합니다. 이는 맵핑 패키지가 `map`을 작업 프레임으로
    # 선택한 것과 일치합니다.
    output_frame: "map"
    trajectory_topic: "/planning/trajectory"
    corridor_half_width_m: 3.0

    # FOLLOW_UNTIL_REPLACED(2026-09-17 설정): 목표 지점이 없습니다. 컨트롤러는
    # 차량이 어디서 출발하든 가장 가까운 경로 구간부터 추종하며 정지 상태를
    # 래치하지 않습니다. 경로 끝에서는 속도가 0까지 감소하고 마지막 1 m에서
    # STOP END_OF_ROUTE를 유지합니다. 래치되지 않으므로 차량이 경로의 다른
    # 위치로 이동하면 즉시 추종을 재개합니다. STOP_AT_END는 기존의 목표 정지와
    # 래치 동작을 복원합니다(아래 goal_tolerance_m / restart_near_start_m 참고).
    #
    # 루프 폐쇄는 꺼져 있습니다(0.0). 시작점 근처로 돌아오는 경로도 처음부터
    # 끝까지 한 번만 주행합니다. 10.0으로 설정하면 해당 경로를 폐루프로 연결해
    # 정지할 때까지 반복 주행합니다. 단, 연결부는 실제 맵핑 주행에 없던 직선
    # 지름길입니다. 20260914_220126에서는 경로 시작점과 51도 꺾여 연결되었고,
    # 재생 시 Stanley의 헤딩 오차가 33도까지 증가했습니다. 시작점을 지나서까지
    # 주행하며 기록한 맵에서만 사용할 가치가 있습니다.
    goal_mode: "FOLLOW_UNTIL_REPLACED"
    loop_closure_max_gap_m: 0.0
    # 연결점을 찾을 때 시작점 이후와 끝점 이전을 탐색하는 거리입니다. 시작점에
    # 못 미쳐 멈췄거나 시작점을 지나 계속 주행한 기록을 처리합니다.
    loop_closure_search_m: 30.0
    loop_closure_max_turn_deg: 60.0

    # ---- 속도 -----------------------------------------------------------
    # 직선 10~15 km/h, 곡선 5~10 km/h(2026-09-15 설정). 각 웨이포인트에서:
    #
    #   상한 = min(최고 속도, sqrt(최대 횡가속도 * R))
    #          R < curve_radius_m이면 curve_max_speed로 제한
    #          min_speed를 하한으로 적용
    #   이후 제동(max_decel) 및 가속(max_accel) 램프로 구간을 연결합니다.
    #
    # R은 curvature_smoothing_window 적용 후의 회전반경입니다. 0.5 m/s^2일 때
    # 3.7 m 코너(20260914_220126에서 가장 급한 코너)는 하한 5 km/h,
    # 8 m는 7.2 km/h, 14.8 m는 10 km/h가 됩니다. curve_radius_m보다 급한
    # 구간은 곡률이 완만해도 10 km/h 이하로 유지하고 직선은 15 km/h로
    # 주행합니다. 직선에서 10~15 사이 값은 곡선 진입·이탈 램프입니다
    # (2.0 m/s^2로 15 -> 10 km/h 감속 시 2.4 m 필요).
    #
    # 현재 경로 4개(20260913_101241, 20260913_103732, 20260914_215511,
    # 20260914_220126)에서 측정한 결과 직선은 100%가 10~15 km/h,
    # 곡선(R < 30 m)은 100%가 5~10 km/h 범위였습니다. 곡선 상한이 없으면
    # 반경 15~34 m 굽은 구간에서 곡선 길이의 18~66%를 10~15 km/h로 주행했습니다.
    #
    # 이 프로파일에는 정지 상태 출발 램프가 없습니다. 첫 몇 m는 컨트롤러 자체의
    # 시작 램프(아래 start_speed_kmph / start_accel_mps2)가 처리합니다.
    max_speed_kmph: 25.0    # km/h(route_publisher/controllers에서 3.6으로 한 번 나눔. 미리 나누지 말 것)

    # 곡선 내부의 5~10 km/h 범위를 결정합니다. 어떤 코너가 하한에 가깝고 어떤
    # 코너가 상한에 가까운지를 정하며, 현재 값은 접지력 측정값이 아닙니다.
    max_lateral_accel_mps2: 0.5    # m/s2 물리 단위. km/h 토픽 때문에 재환산하지 말 것

    # 곡선 속도 상한입니다. 둘 다 설정하거나, 순수 접지력 공식만 쓰려면 둘 다
    # 0으로 설정합니다. 2026-09-20: 하한이 이 상한을 넘을 수 없고 그렇지 않으면
    # 프로파일이 거부되므로 하한과 함께 올렸습니다(min_speed_kmph 참고). 코너는
    # 15 km/h로 진입하고(= min_speed_kmph라 모든 곡선이 정확히 15로 주행),
    # 직선 속도 25 km/h로 이탈합니다(curve_exit_lead_m 참고).
    curve_max_speed_kmph: 15.0    # km/h(route_publisher/controllers에서 3.6으로 한 번 나눔. 미리 나누지 말 것)
    curve_radius_m: 30.0

    max_accel_mps2: 2.5    # m/s2 물리 단위. km/h 토픽 때문에 재환산하지 말 것
    # 프로파일이 가정하는 차량 감속 능력입니다. 구동 MCU는 목표값이 낮아지면
    # 스로틀만 줄이므로(P 제어, 브레이크 없음), 이는 제동 감속도가 아니라
    # 타력주행 감속도입니다. 2026-09-19까지의 2.0은 코너 2.8 m 전에 램프를
    # 시작했지만 차량은 진입 시 여전히 직선 속도였고 코너 출구에서야 곡선
    # 속도에 도달했습니다. 0.5는 추정값입니다. 목표값을 낮춘 뒤의 속도 기울기를
    # 측정해 그 값을 입력하십시오. 작을수록 감속을 일찍 시작합니다.
    # 0.5일 때 20 -> 10 km/h 감속에는 23 m가 필요합니다.
    max_decel_mps2: 0.5    # m/s2 물리 단위. km/h 토픽 때문에 재환산하지 말 것
    # 위 램프에 더해 코너 진입 몇 m 전에 곡선 속도에 도달할지 정합니다.
    # 프로파일은 이 지점부터 코너까지 곡선 속도를 유지하므로, 스로틀 지연과
    # 다소 낙관적인 max_decel_mps2 때문에 감속 지점이 코너 안으로 밀리지
    # 않습니다. 0이면 비활성화합니다.
    curve_speed_lead_m: 3.0
    # 코너를 직선 속도로 빠져나오기 위한 값입니다. 곡선 끝에서 이 거리 안에
    # 들어오면(가장 급한 지점 이전에는 절대 적용하지 않음) 속도 상한을
    # max_speed_kmph까지 해제합니다. 따라서 가속 램프가 코너 안에서 시작되고
    # 출구에서 직선 속도로 복귀합니다. 10 -> 20 km/h 가속에는 1.5 m/s2에서
    # 7.7 m, 2.5에서 4.6 m가 필요합니다. 정점에서 곡선 끝까지가 흔히 5~7 m라
    # max_accel_mps2를 2.5로 설정했습니다. max_accel_mps2는 목표값의 기울기이며,
    # 실제 가속도는 구동 MCU의 스로틀이 결정합니다. 0이면 곡선 이후 가속합니다.
    curve_exit_lead_m: 10.0

    # 곡률 속도 상한에만 적용되는 하한입니다. 종점 정지 시에는 이 값을 지나
    # 계속 0까지 감속합니다. curve_max_speed_kmph를 초과하면 안 됩니다.
    # 2026-09-20: 주행이 너무 느리다는 사용자 의견에 따라 10 -> 15로 변경.
    # 미션 구역에서는 다시 제한됩니다(mission_manager.yaml에서 감속 10,
    # 신호등/회피 7 km/h). 따라서 15 km/h 하한은 미션 구역 밖에 적용됩니다.
    min_speed_kmph: 15.0    # km/h(route_publisher/controllers에서 3.6으로 한 번 나눔. 미리 나누지 말 것)

    # ---- 경로 전처리 ----------------------------------------------------
    # 이 웨이포인트는 실제 주행을 1 m마다 샘플링한 것이므로 운전자의 주행선과
    # 로컬라이제이션의 샘플별 노이즈를 모두 포함합니다. 3점 곡률 계산은 두 번
    # 미분하므로 둘 다 증폭합니다. 평활화하지 않으면 직선의 노이즈 때문에
    # 감속합니다. 샘플 5개는 약 5 m입니다.
    curvature_smoothing_window: 5

    # 맵핑 중 로컬라이제이션이 튀면 기록 경로가 자기 자신을 거슬러 돌아갈 수
    # 있습니다. waypoint_saver_node는 방향을 검사하지 않고 이동 거리 1 m마다
    # 샘플링합니다. 호 길이 기반 전방주시점은 역방향 폴리라인을 따라갈 수
    # 없으므로 해당 웨이포인트를 평활화하지 않고 경고와 함께 제거합니다.
    # 100도는 차량이 실제로 주행할 수 있는 모든 코너는 통과시키면서 점프가
    # 만드는 약 170도 이탈은 검출합니다. 0이면 필터를 비활성화합니다.
    max_route_reversal_deg: 100.0
    min_waypoint_spacing_m: 0.05

    # ---- 생존성 ---------------------------------------------------------
    publish_period_sec: 0.5
    # publish_period_sec보다 커야 합니다. 컨트롤러는 만료된 궤적을 "플래너가
    # 사라짐"으로 판단하고 정지하므로 이 값은 해당 상태의 감지 시간이기도 합니다.
    valid_for_sec: 2.0

vehicle_state_node:
  ros__parameters:
    # gnss_imu_pose_node의 Odometry입니다. RTK 지면 속도는 twist.linear.x,
    # yaw 각속도는 twist.angular.z에 들어 있습니다.
    #
    # `/state_estimation/pose`가 아닙니다. 그 이름은 얼핏 올바른 선택처럼 보이지만
    # 아무 노드도 발행하지 않으며, 의도적으로 활성 상태 추정기로 사용하지 않는
    # MOLA smoother의 토픽 이름입니다. 같은 이유로 localization.launch.py도
    # `state_pose_topic`을 이 토픽으로 설정합니다.
    input_odom_topic: "/gnss_imu/pose"
    vehicle_state_topic: "/localization/vehicle_state"
    min_speed_for_curvature_kmph: 1.8
    report_period_sec: 10.0

pure_pursuit_node:
  ros__parameters:
    trajectory_topic: "/planning/trajectory"
    vehicle_state_topic: "/localization/vehicle_state"

    # ---- 액추에이터 출력 ------------------------------------------------
    # ros_can_bridge의 토픽입니다. 이 노드가 실행 중일 때는 자체 컨트롤러가 있는
    # stop_mission을 포함해 다른 어떤 노드도 이 토픽들을 발행하면 안 됩니다.
    angle_topic: "/target_angle"
    speed_topic: "/target_speed"
    brake_topic: "/brake"

    # +1.0 또는 -1.0만 허용됩니다(그 외 값은 노드가 거부). 조향비는
    # vehicle.yaml의 steering_command_gain입니다. 2026-09-19까지 여기 있던
    # 2.0은 사실상 조향비 역할을 하여 실제 바퀴각이 요청값의 1/4만 나오게
    # 했습니다. 배선을 변경한 뒤에는 /encoder와 비교해 부호를 다시 확인하십시오.
    steering_sign: 1.0

    # ---- 조향 감각(= 전방주시거리) -------------------------------------
    # 전방주시는 시간 개념입니다. 차량이 몇 초 주행한 거리만큼 앞을 조향할지
    # 정한 뒤 m 범위로 제한합니다. 조향 민감도를 결정하는 유일한 조절값이며
    # 컨트롤러에서 헤딩 노이즈를 거르는 유일한 필터이기도 합니다. yaw 오차는
    # 명령을 대략 (2 * wheelbase / ld) * error만큼 변화시킵니다.
    #
    #   길게  -> 더 부드럽고 늦게 반응하며 코너를 더 안쪽으로 자름
    #   짧게  -> 더 타이트하고 빠르게 반응하지만 좌우 진동 가능
    #
    # 주의: 이 게인은 초 단위 시간이며 km/h가 아닌 m/s 속도에 곱합니다.
    # 15 km/h(4.17 m/s)에서 1.7초는 7.1 m이고, 아래에서 6.0 m로 제한됩니다.
    #
    # 속도 모드 전용(lookahead_mode: "speed", 현재 차량은 아래의 "curvature"
    # 사용). 2026-09-18: 실차에서 너무 멀리 보는 것으로 확인된
    # 3.4초 / 4.0 / 12.0 m의 절반으로 줄였습니다. 모든 속도에서 전방주시거리가
    # 절반이 됩니다.
    #
    #   속도        이전      현재(직선)
    #   15 km/h    12.0 m   6.0 m  (상한)
    #   10 km/h     9.4 m   4.7 m
    #    5 km/h     4.7 m   2.4 m
    #
    # lookahead_min_m / lookahead_gain_s = 4.2 km/h 아래에서는 하한값이
    # 적용됩니다. pure_pursuit_node가 시작할 때 이를 출력하며 실제 사용 중인
    # ld는 ~/lookahead_distance에서 확인할 수 있습니다.
    #
    # 거리가 짧으면 헤딩 노이즈 필터링 성능이 줄어듭니다. yaw 오차는 명령을
    # 약 (2 * wheelbase / ld) * error만큼 변화시키며, 계수는 6 m에서 0.45,
    # 2 m 하한에서 1.34입니다. 직선에서 바퀴가 흔들리면 먼저
    # lookahead_min_m을 올리십시오.
    lookahead_gain_s: 1.7
    lookahead_min_m: 1.0
    lookahead_max_m: 6.0

    # ---- 전방주시 모드 --------------------------------------------------
    # "curvature"(2026-09-18): 전방주시거리는 lookahead_straight_m 앞까지의
    # 경로가 얼마나 급한지에만 따라 결정됩니다. 속도는 무시하며 위의 속도 관련
    # 값 3개는 사용하지 않습니다.
    #
    #   전방의 최소 반경           전방주시거리
    #   >= 50 m (직선)            7.0 m
    #      30 m                   6.0 m
    #      20 m                   4.8 m
    #   <= 15 m (곡선)            3.5 m
    #
    # 2026-09-19: 7 / 3 m(기존 4 / 1 m). 직선 전방주시거리 전체에서 코너를
    # 탐색하므로 이제 코너 7 m 전부터 거리가 줄기 시작합니다.
    # 2026-09-20: 곡선 3 -> 3.5 m. 20260913_103732의 가장 급한 코너
    # (R 9.0 m)에서 경로 추종 자체에 실제 바퀴각 8.4도가 필요합니다. 횡오차
    # 0.5 m는 ld 3 m에서 8.5도를 더 요구하지만 3.5 m에서는 4.8도만 요구합니다.
    # 폭 3.8 m 차선에서 코너를 안쪽으로 자르는 양은 0.12 -> 0.17 m가 됩니다.
    #
    # 두 반경 사이에서는 곡률(1 / radius)에 따라 선형 보간하므로 굽은 구간에
    # 들어가며 부드럽게 줄어듭니다. 사용 중인 ld는 ~/lookahead_distance에서
    # 확인합니다. "speed"는 위의 lookahead_gain_s / _min_m / _max_m 방식으로
    # 돌아갑니다.
    #
    # 헤딩 오차 1도당 실제 바퀴 명령은 약 2 * 1.34 / ld만큼 변합니다.
    # 곡선 전방주시거리 3.5 m에서는 0.77도, 직선에서는 0.38도입니다. 코너를
    # 너무 안쪽으로 자르면 lookahead_curve_m을 낮추고, 흔들리면 올리십시오.
    lookahead_mode: "curvature"
    lookahead_straight_m: 7.0
    lookahead_curve_m: 3.5
    lookahead_straight_radius_m: 50.0
    lookahead_curve_radius_m: 15.0

    # ---- 타이밍 및 제한 -------------------------------------------------
    control_rate_hz: 20.0
    vehicle_state_timeout_sec: 0.5
    goal_tolerance_m: 1.0
    # 종점에서 정지한 뒤(STOP_AT_END) 차량이 경로 시작부로 돌아오면 추종을
    # 재개합니다. 조건은 경로를 따라 시작점에서 이 거리 안, 
    # corridor_half_width_m 안쪽, 경로 끝점에서 2 * goal_tolerance_m보다 먼
    # 곳입니다(양 끝이 가까운 루프가 정지한 자리에서 재시작하지 않도록 함).
    # 재시작한 주행이나 백에서 gnss_imu_pose_node 자세가 다시 나타나기 전에
    # 이동하는 약 5 m보다 커야 합니다. 5 m로 설정했을 때 첫 자세는 이미 경로상
    # 5.4 m(Pure Pursuit) / 7 m(Stanley) 지점에 도착해 있었습니다.
    # 0이면 경로 추종을 재시작할 때까지 정지 상태를 유지합니다.
    restart_near_start_m: 10.0
    corridor_half_width_m: 3.0

    # 실제 시간 기준 watchdog입니다. 제어 루프가 아무 출력도 만들지 않을 때
    # 노드가 보고하기까지의 시간입니다. 진행하지 않는 /clock과 use_sim_time을
    # 함께 사용해 아무 경고 없이 멈추는 상황을 검출합니다.
    stall_warning_period_sec: 5.0

    # ---- 출발 램프 ------------------------------------------------------
    # 경로 속도 프로파일에는 정지 상태 출발 램프가 없습니다. 따라서 추종 시작
    # 또는 재개 후 첫 몇 m 동안 명령 상한을 sqrt(v0^2 + 2 a d)로 제한합니다.
    # v0 = start_speed_kmph(현재 속도가 더 높으면 현재 속도),
    # a = start_accel_mps2, d = 이후 주행 거리(m)입니다. 5 km/h와 1.0 m/s^2에서
    # 상한은 2.9 m 후 10 km/h, 7.7 m 후 15 km/h에 도달합니다. 제한이 적용되는
    # 동안 상태에 "ramp"가 표시됩니다. 0이면 비활성화합니다.
    start_speed_kmph: 5.0    # km/h(route_publisher/controllers에서 3.6으로 한 번 나눔. 미리 나누지 말 것)
    start_accel_mps2: 1.0    # m/s2 물리 단위. km/h 토픽 때문에 재환산하지 말 것

    # ---- 헤딩 획득 저속 전진 -------------------------------------------
    # 초기 헤딩은 센서 스택 ESKF(이미 검증된 경우), 검증된 LiDAR 맵 정합,
    # 마지막으로 약 5 m 직진 주행의 RTK course 순으로 얻습니다.
    # gnss_imu_pose_node는 /gnss_imu/heading_acquisition으로 출처를 보고합니다.
    # ESKF와 LiDAR 모두 없는 NEEDS_MOTION 상태에서만 이 노드가 아래 속도로
    # 최대 지정 시간 동안 직진(조향 0)합니다. 그전에는 명령 없이 WAIT합니다.
    # 첫 번째 상태가 되면 출발 램프를 거쳐 추종으로 넘기고, 시간초과 시 제동합니다
    # (STOP HEADING_NOT_ACQUIRED, 재시도하려면 경로 추종 재시작). 5 km/h로 12초는
    # 약 17 m입니다. 이 구간은 앞을 인식하지 않고 주행하므로 전방이 비어 있어야
    # 합니다. 0이면 비활성화(WAITING)합니다.
    # heading_creep_requires_request가 false이면 NEEDS_MOTION을 기다리지 않고
    # 저속 전진합니다(2026-09-18 이전 동작).
    heading_creep_speed_kmph: 5.0    # km/h(route_publisher/controllers에서 3.6으로 한 번 나눔. 미리 나누지 말 것)
    heading_creep_max_sec: 12.0
    heading_creep_requires_request: true

    # ---- 진단 -----------------------------------------------------------
    # `~/`는 노드 자체 namespace로 해석되므로 이 토픽들은
    # /pure_pursuit_node/ 아래에 생성됩니다. 전방주시거리 튜닝 시에는
    # cross_track_error를 확인하고, 실제 사용 중인 ld는 lookahead_distance입니다.
    #
    # localization_monitor_node의 `/lookahead_point`, `/lookahead_marker`와
    # 혼동하지 마십시오. 이들은 고정된 `lookahead_distance_m`(기본 5.0 m)의
    # 화면 표시 전용 추종 목표이며 조향에는 관여하지 않습니다. mapping.rviz에는
    # 이 컨트롤러의 마커가 아니라 해당 빨간 구가 표시됩니다. 컨트롤러가 실제로
    # 조준하는 위치를 보려면 /pure_pursuit_node/lookahead_marker(청록색)를
    # 추가하십시오.
    status_topic: "~/status"
    cross_track_error_topic: "~/cross_track_error"
    lookahead_distance_topic: "~/lookahead_distance"
    lookahead_marker_topic: "~/lookahead_marker"

stanley_node:
  ros__parameters:
    trajectory_topic: "/planning/trajectory"
    vehicle_state_topic: "/localization/vehicle_state"

    # ---- 액추에이터 출력 ------------------------------------------------
    # pure_pursuit_node와 같은 토픽입니다. path_tracking.launch.py는
    # controller_type으로 지정한 컨트롤러만 시작합니다.
    angle_topic: "/target_angle"
    speed_topic: "/target_speed"
    brake_topic: "/brake"

    # 게인이 아니라 부호입니다. +1.0 또는 -1.0만 허용되며 그 외 값은 노드가
    # 거부합니다. 2026-09-12 측정값은 +1.0입니다(README). Stanley에는 아래에
    # 명시적인 게인이 있으므로 이 값으로 조향 세기를 튜닝하지 마십시오.
    steering_sign: 1.0

    # ---- STANLEY 제어식 -------------------------------------------------
    #   delta = heading_gain * (route yaw - vehicle yaw)
    #         + atan(cross_track_gain * e / (softening + v))
    # e는 앞차축(뒷차축보다 wheelbase_m만큼 앞)의 횡오차이며 차량이 경로의
    # 왼쪽에 있을 때 양수입니다.
    #
    # cross_track_gain [1/s]: 1 m 이탈당 경로로 복귀시키는 조향 세기입니다.
    #   높게 -> 빠르게 수렴하지만 흔들릴 수 있음, 낮게 -> 부드럽지만 넓게 이탈
    # 5 km/h(1.39 m/s), 완화값 3.6 km/h에서 1.0은 0.5 m 오차를
    # atan(1.0 * 0.5 / 2.39) = 조향 11.8도로 변환합니다.
    cross_track_gain: 1.0

    # 분모의 속도에 더해지므로 정지 상태에서도 제어식이 정의되고 저속 차량에
    # 작은 오차만으로 큰 조향을 명령하지 않습니다. 이 파일의 다른 속도처럼
    # 파라미터 경계에서는 km/h 단위입니다.
    cross_track_softening_kmph: 3.6

    # 1.0이 기본 Stanley 제어식입니다. 차량 헤딩은 저속에서 노이즈가 큰 RTK
    # 속도 course에서 오며, 이 게인에서는 노이즈가 줄지 않고 조향에 전달됩니다.
    # 보행 속도의 직선 주행에서 바퀴가 떨리면 낮추십시오(예: 0.7).
    heading_gain: 1.0

    # 경로 방향은 앞차축 투영점을 중심으로 이 길이의 경로 호를 가로지르는 현의
    # 방향입니다. 기록된 웨이포인트 yaw가 아니라 경로 형상을 사용합니다.
    # 웨이포인트 간격은 약 1 m이므로 2.0 m는 약 2개를 포함합니다.
    heading_window_m: 2.0

    # ---- 출발 / 안전 ----------------------------------------------------
    # 차량 yaw와 경로 방향의 차이가 이 값보다 크면 브레이크를 작동한 채
    # STOP HEADING_NOT_ALIGNED를 유지합니다. 0이면 비활성화합니다(2026-09-17
    # 설정). 이 경우 Pure Pursuit처럼 어떤 방향에서 출발하든 경로로 조향합니다.
    # 대신 정지 상태에서 차량을 돌린 뒤 남은 오래된 course나 후진으로 course가
    # 180도 뒤집힌 경우처럼 헤딩 자체가 틀려도 거부하지 않고 조향합니다.
    # 60.0으로 설정하면 게이트를 복원합니다.
    max_heading_error_deg: 0.0

    # ---- 타이밍 및 제한 -------------------------------------------------
    control_rate_hz: 20.0
    vehicle_state_timeout_sec: 0.5
    goal_tolerance_m: 1.0
    # 종점에서 정지한 뒤(STOP_AT_END) 차량이 경로 시작부로 돌아오면 추종을
    # 재개합니다. 조건은 경로를 따라 시작점에서 이 거리 안,
    # corridor_half_width_m 안쪽, 경로 끝점에서 2 * goal_tolerance_m보다 먼
    # 곳입니다(양 끝이 가까운 루프가 정지한 자리에서 재시작하지 않도록 함).
    # 재시작한 주행이나 백에서 gnss_imu_pose_node 자세가 다시 나타나기 전에
    # 이동하는 약 5 m보다 커야 합니다. 5 m로 설정했을 때 첫 자세는 이미 경로상
    # 5.4 m(Pure Pursuit) / 7 m(Stanley) 지점에 도착해 있었습니다.
    # 0이면 경로 추종을 재시작할 때까지 정지 상태를 유지합니다.
    restart_near_start_m: 10.0
    corridor_half_width_m: 3.0
    stall_warning_period_sec: 5.0

    # ---- 출발 램프 ------------------------------------------------------
    # 경로 속도 프로파일에는 정지 상태 출발 램프가 없습니다. 따라서 추종 시작
    # 또는 재개 후 첫 몇 m 동안 명령 상한을 sqrt(v0^2 + 2 a d)로 제한합니다.
    # v0 = start_speed_kmph(현재 속도가 더 높으면 현재 속도),
    # a = start_accel_mps2, d = 이후 주행 거리(m)입니다. 5 km/h와 1.0 m/s^2에서
    # 상한은 2.9 m 후 10 km/h, 7.7 m 후 15 km/h에 도달합니다. 제한이 적용되는
    # 동안 상태에 "ramp"가 표시됩니다. 0이면 비활성화합니다.
    start_speed_kmph: 5.0    # km/h(route_publisher/controllers에서 3.6으로 한 번 나눔. 미리 나누지 말 것)
    start_accel_mps2: 1.0    # m/s2 물리 단위. km/h 토픽 때문에 재환산하지 말 것

    # ---- 헤딩 획득 저속 전진 -------------------------------------------
    # 초기 헤딩은 센서 스택 ESKF(이미 검증된 경우), 검증된 LiDAR 맵 정합,
    # 마지막으로 약 5 m 직진 주행의 RTK course 순으로 얻습니다.
    # gnss_imu_pose_node는 /gnss_imu/heading_acquisition으로 출처를 보고합니다.
    # ESKF와 LiDAR 모두 없는 NEEDS_MOTION 상태에서만 이 노드가 아래 속도로
    # 최대 지정 시간 동안 직진(조향 0)합니다. 그전에는 명령 없이 WAIT합니다.
    # 첫 번째 상태가 되면 출발 램프를 거쳐 추종으로 넘기고, 시간초과 시 제동합니다
    # (STOP HEADING_NOT_ACQUIRED, 재시도하려면 경로 추종 재시작). 5 km/h로 12초는
    # 약 17 m입니다. 이 구간은 앞을 인식하지 않고 주행하므로 전방이 비어 있어야
    # 합니다. 0이면 비활성화(WAITING)합니다.
    # heading_creep_requires_request가 false이면 NEEDS_MOTION을 기다리지 않고
    # 저속 전진합니다(2026-09-18 이전 동작).
    heading_creep_speed_kmph: 5.0    # km/h(route_publisher/controllers에서 3.6으로 한 번 나눔. 미리 나누지 말 것)
    heading_creep_max_sec: 12.0
    heading_creep_requires_request: true

    # ---- 진단 -----------------------------------------------------------
    # /stanley_node/ 아래에 생성됩니다. cross_track_error는 앞차축에서의 m 단위
    # 횡오차(양수 = 차량이 경로 왼쪽), heading_error는 rad 단위입니다
    # (경로 yaw - 차량 yaw, 양수 = 경로가 차량 진행 방향의 왼쪽을 향함).
    # target_marker(자홍색)는 경로 위에 투영한 앞차축의 수선의 발입니다.
    status_topic: "~/status"
    cross_track_error_topic: "~/cross_track_error"
    heading_error_topic: "~/heading_error"
    target_marker_topic: "~/target_marker"
